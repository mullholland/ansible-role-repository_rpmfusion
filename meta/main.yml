---
galaxy_info:
  author: Mullholland
  namespace: mullholland
  role_name: repository_rpmfusion
  description: Install the RPM Fusion repository (free and nonfree possible)
  license: MIT
  company: none
  min_ansible_version: "2.10"

  platforms:
    - name: EL
      versions:
        - all
    - name: Fedora
      versions:
        - all
        # Rocky and AlmaLinux are declared via meta/preferences.yml's
        # extra_platforms instead of here: the Galaxy schema only accepts
        # "all" or a fixed legacy enum for these platforms' versions, so
        # the "8-9" subset (see preferences.yml comment) can't be
        # expressed here.

  galaxy_tags:
    - cloud
    - development
    - system

dependencies: []
# List your role dependencies here, one per line. Be sure to remove the '[]' above,
# if you add dependencies to this list.
